name: CI

# Runs on every pull request and every push to main.
# Render deploys main only after this "checks" job passes (render.yaml: autoDeployTrigger: checksPass).
# Branch protection on main should require the "checks" job, so a failing
# lint, scan, contract check or test blocks the merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, scan, contract, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ESLint, zero warnings)
        run: npm run lint
      - name: OpenAPI contract is valid (OpenAPI 3.1.1)
        run: npm run lint:openapi
      - name: Dependency security scan (high and critical)
        run: npm run audit
      - name: Full test suite with coverage (T-01 to T-16 + test interface)
        run: npm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
