name: CI

# Runs on every pull request and every push to main.
# Google Cloud Build deploys main to Cloud Run; live-check.yml then tests the live system.
# Branch protection on main should require the "checks" job, so a failing
# lint, scan, contract check or test blocks the merge.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_SHA: ${{ github.sha }}
  REMEDIATION_MODE: deterministic

jobs:
  checks:
    name: Lint, scan, contract, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ESLint, zero warnings)
        run: npm run lint
      - name: OpenAPI contract is valid (OpenAPI 3.1.1)
        run: npm run lint:openapi
      - name: Dependency security scan (high and critical)
        run: npm run audit
      - name: Full test suite with coverage (contract, parsers, remediation, interface, UI)
        run: npm run test:coverage
      - name: Collect AC and operation evidence for this commit
        run: npm run evidence
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: docs/evidence/local/
