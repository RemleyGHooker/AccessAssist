name: Live check

# After Google Cloud Build deploys a commit to Cloud Run, run the full Team 19
# suite against the live system and run our deployed tester against it too.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

env:
  LIVE_URL: https://accessassist-git-365255122806.europe-west1.run.app

jobs:
  live:
    name: Tests against the live system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for the Google deploy of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            s=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs \
              --jq '[.check_runs[] | select(.name|startswith("cloudrun"))] | last | (.status+" "+(.conclusion//""))')
            echo "deploy: $s"
            case "$s" in "completed success") break;; "completed "*) echo "::error::Google deploy failed"; exit 1;; esac
            sleep 20
          done
          sleep 20
      - name: Live system answers
        run: |
          curl -sS --max-time 90 -i "$LIVE_URL/system/health" | tee health.txt
          echo "::notice title=Live health::$(tail -1 health.txt)"
      - name: Full suite against the live system
        run: |
          set -o pipefail
          BASE_URL="$LIVE_URL/system" npm run test:remote 2>&1 | tee remote.txt
      - name: Summarize suite results
        if: always()
        run: |
          echo "::notice title=Suite totals::$(grep -E '^# (tests|pass|fail|skipped)' remote.txt | tr '\n' ' ')"
          grep -E '^(ok|not ok) ' remote.txt | while read -r line; do echo "::notice title=Test::$line"; done
      - name: Our deployed tester against our own system
        if: always()
        run: |
          SID=$(curl -sS --max-time 120 -X POST "$LIVE_URL/tester/test/setup" -H 'content-type: application/json' \
            -d "{\"target_url\":\"$LIVE_URL/system\"}" | jq -r .session_id)
          echo "session $SID"
          curl -sS --max-time 600 -X POST "$LIVE_URL/tester/test/run" -H 'content-type: application/json' \
            -d "{\"session_id\":\"$SID\"}" | tee tester-report.json | jq .
          echo "::notice title=Tester report::$(jq -c '{passed: ([.results[]|select(.outcome=="pass")]|length), failed: ([.results[]|select(.outcome=="fail")]|length), errors: ([.results[]|select(.outcome=="error")]|length), skipped: ([.results[]|select(.outcome=="skip")]|length), coverage: {component: .coverage.component, system: .coverage.system}}' tester-report.json)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-results
          path: |
            remote.txt
            tester-report.json
            health.txt
